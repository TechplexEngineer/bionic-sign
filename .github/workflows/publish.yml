name: Publish package

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Test
        # The browser project requires a separately installed Chromium binary;
        # package verification uses the deterministic server test project.
        run: npm run test:unit -- --run --project server
      - name: Build package tarball
        run: mkdir -p "$RUNNER_TEMP/package" && npm pack --pack-destination "$RUNNER_TEMP/package"
      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: package
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish to npm
        run: npm publish ./package/*.tgz

  publish-github:
    name: Publish to GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: package
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@techplexengineer'
          package-manager-cache: false
      - name: Publish to GitHub Packages
        run: npm publish ./package/*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
